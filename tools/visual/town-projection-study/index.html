<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主城原画投影三维研究样板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #26312c; }
    #viewport { position: absolute; inset: 0; overflow: hidden; }
    #stage { position: absolute; width: 1024px; height: 525px; left: 50%; top: 50%; transform-origin: center; }
    #stage > img, #stage > canvas { position: absolute; inset: 0; width: 1024px; height: 525px; }
    #stage > img { object-fit: fill; }
    #state { position: absolute; left: 4px; bottom: 3px; border-radius: 3px; padding: 2px 4px;
      font: 10px/1.2 system-ui, sans-serif; color: #fff; background: #0009; }
  </style>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <div id="state">加载中</div>
  <script src="../../../assets/hd2d/three.min.js"></script>
  <script src="prototype.js"></script>
</body>
</html>
