<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6ecd5">
<title>放置帝国</title>
<script>
/* 独立界面偏好，不写入或迁移 rts_save；在样式加载前应用以免夜间闪白。 */
(function(){
  var key='idle_empire_visual_theme';
  var theme='light';
  try{if(localStorage.getItem(key)==='dark')theme='dark';}catch(_){/* 隐私模式继续使用日间默认值 */}
  function apply(next){
    theme=next==='dark'?'dark':'light';
    document.documentElement.dataset.theme=theme;
    document.documentElement.style.colorScheme=theme;
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.content=theme==='dark'?'#17232b':'#f6ecd5';
    try{if(window.IdleEmpireTheme)window.IdleEmpireTheme.setDarkMode(theme==='dark');}catch(_){}
    return theme;
  }
  window.VisualTheme={
    get:function(){return theme;},
    set:function(next){
      var result=apply(next);
      try{localStorage.setItem(key,result);}catch(_){/* 当前页面仍可切换 */}
      return result;
    },
    toggle:function(){return this.set(theme==='dark'?'light':'dark');}
  };
  apply(theme);
})();
</script>
<!-- ==================== CSS 样式表 ==================== -->
<!-- 像素风暗色主题，手机框体布局(400px宽)，响应式适配 -->
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#1a1a24;color:#d0d0d8;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;
  display:flex;justify-content:center;align-items:center;
  user-select:none;-webkit-user-select:none;
}
/* ===== 手机框体 ===== */
#phone{
  width:min(400px,100vw);height:100dvh;max-height:none;
  min-width:0;
  background:#12121c;border:1px solid #2a2a3a;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
/* ===== 顶部资源栏 ===== */
#topbar{
  background:linear-gradient(180deg,#0c0e18,#090a12);
  padding:6px max(4px,2vw);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  border-bottom:2px solid #222;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 2px 4px rgba(0,0,0,.3);
}
.top-res{
  text-align:center;padding:2px;
  transition:all .2s ease;position:relative;
}
.top-res:hover{
  background:rgba(255,255,255,.02);
  transform:translateY(-1px);
}
.top-res .icon{font-size:13px}
.top-res .val{
  font-size:12px;font-weight:bold;color:#f0d060;
  text-shadow:1px 1px 0 #000,0 0 4px rgba(240,208,96,.3);
  transition:all .3s ease;
}
.top-res .cap{font-size:8px;color:#5a5a6e;display:block}
.top-res .label{font-size:9px;color:#666;text-shadow:1px 1px 0 #000}
/* ===== 主内容区 + 城镇场景 + 底部导航 ===== */
#main{
  flex:1;overflow-y:auto;padding:8px clamp(6px,2.4vw,10px);
  background:linear-gradient(180deg,#101220,#0b0d17);
  position:relative;
}
#main::-webkit-scrollbar{width:4px}
#main::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
#main::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#4a4a5e,#3a3a4e);
  border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
#main::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,#5a5a6e,#4a4a5e);
}
#town-scene{display:none;padding:0 0 6px}
#navbar{
  background:#0a0a14;border-top:1px solid #222;display:flex;flex-shrink:0;
}
.nav-btn{
  flex:1;min-width:0;text-align:center;padding:8px 2px;cursor:pointer;font-size:10px;
  color:#666;transition:all .2s ease;border:none;background:none;font-family:inherit;
  position:relative;
}
.nav-btn::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--px-gold-soft);
  transition:width .3s ease;
}
.nav-btn:hover{color:#999}
.nav-btn.on{
  background:linear-gradient(180deg,#121522,#0a0a14);
  color:var(--px-gold-soft);
  box-shadow:inset 0 3px 0 #2b3144,inset 0 -1px 0 rgba(240,208,96,.2);
}
.nav-btn.on::after{width:80%}
.nav-btn .nicon{font-size:18px;display:block;margin-bottom:2px;transition:transform .2s ease}
.nav-btn:hover .nicon{transform:translateY(-2px)}
.nav-btn.on .nicon{text-shadow:0 0 8px rgba(240,208,96,.4)}

/* ===== 卡片 / 进度条 / 按钮 ===== */
.card{
  background:#181828;border:1px solid #262640;border-radius:8px;
  padding:10px 12px;margin-bottom:8px;
}
.card h3{font-size:14px;color:#e0e0e0;margin-bottom:6px}
.desc{font-size:11px;color:#777;margin:2px 0}

.prog-wrap{
  background:#0a0a14;height:6px;margin:4px 0;overflow:hidden;
  border:1px solid #1a1a28;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.prog-fill{
  background:repeating-linear-gradient(90deg,#b47b2a 0 6px,#f0d060 6px 10px);
  height:100%;transition:width .5s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 8px rgba(240,208,96,.3);
  animation:prog-shimmer 1.5s linear infinite;
}
@keyframes prog-shimmer{
  0%{background-position:0 0}
  100%{background-position:40px 0}
}

.btn{
  display:inline-block;padding:7px 16px;border-radius:16px;
  font-size:12px;font-family:inherit;cursor:pointer;border:none;transition:.15s;
}
.btn-go{background:#f0d060;color:#1a1a24;font-weight:bold}
.btn-go:active{background:#c8a830}
.btn-go:disabled{background:#444;color:#888}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn-ghost{background:transparent;border:1px solid #444;color:#aaa}
.btn-ghost:active{background:#222}
.btn-ghost:disabled{border-color:#30364a;color:#5d6475;background:#11131d}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:12px}
.btn-xs{padding:2px 8px;font-size:10px;border-radius:10px}
.btn-danger{background:#c0392b;color:#fff}
.btn-speed{
  padding:6px 12px;border-radius:4px;font-size:12px;background:#1a1a2e;
  border:1px solid #333;color:#888;cursor:pointer;
}
.btn-speed.on{background:#f0d060;color:#1a1a24;border-color:#f0d060;font-weight:bold}
.btn-speed[hidden]{display:none}

/* ===== 兵种行 ===== */
.unit-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:2px solid #1e1e2e;
  transition:all .2s ease;
}
.unit-row:hover{
  background:rgba(255,255,255,.02);
  border-bottom-color:#2e2e3e;
}
.unit-row:last-child{border-bottom:none}
.unit-row .uicon{font-size:20px;width:30px;text-align:center;transition:transform .2s ease}
.unit-row:hover .uicon{transform:scale(1.1)}
.unit-row .uinfo{flex:1}
.unit-row .uname{font-size:13px;color:#e0e0e0;text-shadow:1px 1px 0 #000}
.unit-row .udetail{font-size:10px;color:#777}
.unit-row .ucount{
  font-size:14px;font-weight:bold;color:#f0d060;min-width:24px;text-align:center;
  text-shadow:1px 1px 0 #000,0 0 6px rgba(240,208,96,.4);
}

/* ===== 阵型行（前/中/后排）===== */
.form-row{
  margin:4px 0;padding:0;
  background:linear-gradient(180deg,#111421,#0d0f18);
  border:2px solid #2b3144;border-left-width:4px;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),0 2px 0 #05060b;
  white-space:nowrap;text-align:center;
  transition:all .2s ease;
}
.form-row:hover{
  background:linear-gradient(180deg,#141628,#0f111c);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.07),0 3px 0 #05060b;
}
.form-row.r1{border-color:#2b3144;border-left-color:var(--px-red)}
.form-row.r2{border-color:#2b3144;border-left-color:var(--px-gold)}
.form-row.r3{border-color:#2b3144;border-left-color:var(--px-blue)}
.form-row .ftitle{
  font-size:11px;color:#aaa;margin-bottom:3px;text-align:left;padding:4px 8px;
  text-shadow:1px 1px 0 #000;
}
.form-slot{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:#202038;padding:3px 5px;
  font-size:10px;cursor:pointer;margin:1px;min-width:56px;min-height:92px;text-align:center;vertical-align:middle;
  border:2px dashed #333;transition:all .2s ease;
}
.form-slot:hover{
  background:#252848;
  border-color:#4a4a6e;
  transform:translateY(-2px);
  box-shadow:0 4px 8px rgba(0,0,0,.3);
}
.form-slot.filled{
  background:linear-gradient(180deg,#252545,#1e1e38);
  border:2px solid #3a3a5e;
}
.form-slot.filled:hover{
  border-color:#4a4a7e;
  box-shadow:inset 0 0 8px rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.4);
}
.form-slot:active{background:#303048;transform:translateY(0)}
.form-empty{
  font-size:10px;color:#444;padding:4px 0;flex:1;
  display:flex;align-items:center;justify-content:center;
}

/* ===== 弹窗系统 ===== */
.modal-overlay{
  display:none;position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.82);z-index:70;justify-content:center;align-items:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex;animation:modal-fade-in .25s ease}
@keyframes modal-fade-in{
  from{opacity:0}
  to{opacity:1}
}
.modal-box{
  background:linear-gradient(180deg,#1a1a2e,#12131f);
  border:3px solid #59617b;
  padding:16px;width:85%;max-height:70%;
  animation:modal-slide-in .3s ease;
  box-shadow:0 8px 32px rgba(0,0,0,.6),inset 2px 2px 0 rgba(255,255,255,.06);

@keyframes modal-slide-in{

  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-box h3{
  font-size:15px;color:#e0e0e0;margin-bottom:10px;text-align:center;
  text-shadow:1px 1px 2px #000;
  padding-bottom:8px;
  border-bottom:1px solid #2a3144;
}
.population-batch-tools{margin-top:8px;padding:8px;border:1px solid #30364a;border-radius:6px;background:#111522}
.population-batch-title{font-size:11px;color:#d8c888;margin-bottom:6px}
.population-batch-controls{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:10px;color:#aeb8c8}
.population-batch-controls select,.population-batch-controls input,.population-batch-basket input{
  min-width:0;background:#0a0d18;border:1px solid #3b4961;border-radius:4px;color:#e8e8ef;
  padding:5px;font-size:11px;font-family:inherit;
}
.population-batch-controls select{flex:1 1 80px}
.population-batch-controls input{width:62px;flex:0 0 62px}
.population-batch-hint{margin-top:5px;color:#7e8da1;font-size:10px;line-height:1.4}
.population-batch-more{margin-top:7px;color:#9fadc0;font-size:10px}
.population-batch-more summary{cursor:pointer;padding:3px 0}
.population-batch-basket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:6px 0}
.population-batch-basket label{display:flex;align-items:center;gap:3px;min-width:0}
.population-batch-basket input{width:100%}
#population-action-content{overflow-y:auto;max-height:70vh;font-size:11px;line-height:1.55;color:#c5ccda}
#population-action-content .population-preview-line{margin:4px 0}
#population-action-content .population-preview-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
.modal-unit{
  display:flex;align-items:center;gap:12px;padding:10px;margin:5px 0;

  cursor:pointer;transition:all .2s ease;

.modal-unit.sel{

}
.modal-unit .mu-icon{width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.modal-unit .mu-icon .pix-icon.lg{width:58px;height:58px;vertical-align:0}
.modal-unit .mu-info{flex:1}
.modal-unit .mu-name{font-size:13px;color:#e0e0e0}
.modal-unit .mu-detail{font-size:10px;color:#777}
.modal-qty{

.modal-qty input{

.modal-qty button:hover{

  transform:translateY(-1px);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),0 4px 0 #05060b;
}
.modal-qty button:active{

/* ===== 军营分支收纳 ===== */
.branch-header{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  margin:8px 0;cursor:pointer;
  background:linear-gradient(135deg,#151a28 0%,#1c2340 100%);
  border:2px solid #28304a;
  transition:all .25s ease;
  position:relative;overflow:hidden;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.04),0 3px 0 #05060b;
}
.branch-header::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(135deg,transparent 40%,rgba(240,208,96,.04) 100%);
  pointer-events:none;
}
.branch-header:hover{
  border-color:#5a6a8a;
  background:linear-gradient(135deg,#1c2340 0%,#222b4e 100%);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.06),0 0 16px rgba(90,106,138,.2),0 4px 0 #05060b;
  transform:translateY(-1px);
}
.branch-header:active{
  background:linear-gradient(135deg,#1a2030,#1e2640);
  border-color:#4a5a78;
  transform:translateY(1px);
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.2),0 2px 0 #05060b;
}
.branch-arrow{
  font-size:14px;color:#8a92a6;
  transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1),color .2s ease;
  display:inline-block;width:18px;text-align:center;flex-shrink:0;
}
.branch-arrow.open{
  transform:rotate(90deg);
  color:#a8b0c6;
}
.branch-header:hover .branch-arrow{
  color:#b8c0d6;
}
.branch-icon{flex-shrink:0}
.branch-icon .pix-icon.md{width:36px;height:36px;vertical-align:0}
.branch-body{
  overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;
}
.branch-body.folded{max-height:0;opacity:0}
.branch-body.expanded{max-height:3000px;opacity:1}
.branch-body .card{margin:4px 0}
.branch-badge-own{
  font-size:9px;padding:2px 8px;
  background:rgba(64,191,128,.15);color:#40bf80;
  border:1px solid rgba(64,191,128,.3);
  flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  text-shadow:0 0 4px rgba(64,191,128,.4);
}
.branch-hint{
  font-size:9px;color:#4a5268;flex-shrink:0;
  transition:color .2s;
  text-shadow:1px 1px 0 #000;
}
.branch-header:hover .branch-hint{color:#6a7290}
.modal-qty button{
  width:32px;height:32px;border-radius:50%;border:1px solid #444;
  background:#1a1a2e;color:#e0e0e0;font-size:16px;cursor:pointer;
}

.settings-time{
  text-align:center;padding:14px;
  background:linear-gradient(180deg,#121224,#0e0f1a);
  border:2px solid #2b3144;
  margin-bottom:10px;color:#f0d060;font-size:16px;font-weight:bold;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),0 3px 0 #05060b;
  text-shadow:1px 1px 2px #000,0 0 8px rgba(240,208,96,.4);
}
.settings-time .label{
  font-size:10px;color:#777;display:block;margin-bottom:4px;
  text-shadow:1px 1px 0 #000;font-weight:normal;
}

/* ===== 战斗画面 ===== */
#battle-screen{
  display:none;position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,#0a0a14,#060608);z-index:50;flex-direction:column;
}
#battle-screen.active{display:flex;animation:battle-screen-fade-in .3s ease}
@keyframes battle-screen-fade-in{
  from{opacity:0}
  to{opacity:1}
}

#battle-top{
  flex-shrink:0;padding:10px 8px 6px;border-bottom:2px solid #1e1e32;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,#0c0e18,#090a12);
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
#battle-title{
  font-size:15px;font-weight:bold;color:#e0e0e0;
  text-shadow:1px 1px 2px #000;
}
#battle-speed{display:flex;gap:4px}

#battle-field{flex:1;display:flex;flex-direction:column;padding:8px;overflow-y:auto;gap:8px}

.enemy-zone,.our-zone{border-radius:8px;padding:8px}
.enemy-zone{border:1px dashed #e06060;background:#0f0f1c}
.our-zone{border:1px dashed #6090e0;background:#0f0f1c}

.zone-label{font-size:11px;color:#888;margin-bottom:6px;text-align:center}

.battle-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:4px 0}
.battle-row .row-label{font-size:10px;color:#555;width:100%;text-align:center;margin-bottom:2px}

/* ===== 战斗兵团框 + 动画 ===== */
.unit-box{
  width:56px;min-height:56px;background:#181828;border:2px solid #2a2a3e;
  border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:10px;transition:transform .05s,border-color .1s;
  position:relative;padding:2px;
}
.unit-box .ub-icon{font-size:18px;line-height:1}
.unit-box .ub-name{font-size:9px;color:#aaa}
.unit-box .ub-hp{font-size:10px;color:#f0d060;font-weight:bold;margin-top:1px}
.unit-box.targeted{border-color:#f0d060!important;box-shadow:0 0 8px rgba(240,208,96,.5)}
@keyframes strike{
  0%{transform:translateY(0);box-shadow:0 0 8px rgba(255,255,200,.6)}
  30%{transform:translateY(-8px) scale(1.05);box-shadow:0 0 24px rgba(255,255,150,1)}
  60%{transform:translateY(4px) scale(.98);box-shadow:0 0 16px rgba(255,255,200,.8)}
  100%{transform:translateY(0) scale(1);box-shadow:0 0 8px rgba(255,255,200,.6)}
}
.unit-box.attacking{animation:strike .68s ease;border-color:#f0d060!important}
@keyframes shaken{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-6px) rotate(-2deg);border-color:#ff4444}
  35%{transform:translateX(6px) rotate(2deg)}
  55%{transform:translateX(-4px) rotate(-1deg);border-color:#ff0000}
  75%{transform:translateX(4px) rotate(1deg)}
  90%{transform:translateX(-2px)}
}
.unit-box.hit{animation:shaken .75s ease;border-color:#ff3333!important;box-shadow:0 0 16px rgba(255,0,0,.6)}
@keyframes die{0%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}100%{opacity:0;transform:scale(0)}}
.unit-box.dead{animation:die .75s ease forwards;border-color:#ff0000!important}
.unit-box.dead-done{opacity:0;transform:scale(0)}

/* ===== 战斗结果面板 ===== */
#battle-result{
  display:none;flex-shrink:0;padding:12px;
  background:#1a1a2e;border-top:3px solid #f0d060;border-bottom:3px solid #f0d060;
  align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.4);

.worker-wood{background:#a0683a;width:9px;height:11px;border-color:#4a2a18;box-shadow:1px 2px 0 rgba(0,0,0,.3),inset 2px 1px 0 rgba(255,255,255,.08),-1px 4px 0 -2px #3a2210}
.worker-wood:before{left:1px;top:-6px;width:6px;height:5px;background:#c9956a;border-color:#4a2a18;border-radius:60% 60% 30% 30%;box-shadow:0 -2px 0 #4a2818}
.worker-wood:after{
  left:5px;top:-1px;width:3px;height:15px;background:#6b4025;box-shadow:4px -3px 0 #c5cbd3;transform-origin:1px 12px;
}
/* === 采石工 — 灰衣 + 圆盔 + 镐头(镰刀形改) === */
.worker-stone{background:#8992a3;width:7px;height:12px;border-color:#3a3f4a;box-shadow:1px 2px 0 rgba(0,0,0,.3),inset 1px 1px 0 rgba(255,255,255,.12),-2px 3px 0 -1px #545b70}

.worker-stone:after{

}

.worker-chop{animation:townWorkerChop 3.2s linear infinite}
.worker-mine{animation:townWorkerMine 3.2s linear infinite}
.worker-harvest{animation:townWorkerHarvest 3.8s linear infinite}
.worker-step{animation:townWorkerStep 3.8s linear infinite}
.worker-chop:after{animation:townToolChop .6s ease-in-out infinite}
.worker-mine:after{animation:townToolMine .5s ease-in-out infinite}
.worker-harvest:after{animation:townToolHarvest .55s ease-in-out infinite}
@keyframes townWorkerChop{
  0%{transform:translate(0,0) scaleX(1)}
  15%{transform:translate(14px,0) scaleX(1)}
  /* 抡斧砍树：身体起伏 */
  18%{transform:translate(13px,-4px) scaleX(1)}
  22%{transform:translate(15px,1px) scaleX(1)}
  26%{transform:translate(13px,-3px) scaleX(1)}
  30%{transform:translate(15px,0) scaleX(1)}
  34%{transform:translate(14px,-2px) scaleX(1)}
  38%{transform:translate(14px,1px) scaleX(1)}
  44%{transform:translate(14px,0) scaleX(1)}
  52%{transform:translate(14px,0) scaleX(1)}
  /* 转身走回 */
  56%{transform:translate(14px,0) scaleX(-1)}
  72%{transform:translate(0,0) scaleX(-1)}
  76%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(1)}
}
@keyframes townWorkerMine{
  0%{transform:translate(0,0) scaleX(1)}
  15%{transform:translate(18px,0) scaleX(1)}
  /* 挥镐凿石：横向抡摆 */
  18%{transform:translate(14px,-2px) scaleX(1)}
  22%{transform:translate(22px,1px) scaleX(1)}
  26%{transform:translate(15px,-1px) scaleX(1)}
  30%{transform:translate(20px,2px) scaleX(1)}
  34%{transform:translate(16px,-2px) scaleX(1)}
  38%{transform:translate(21px,0) scaleX(1)}
  44%{transform:translate(18px,0) scaleX(1)}
  52%{transform:translate(18px,0) scaleX(1)}
  56%{transform:translate(18px,0) scaleX(-1)}
  72%{transform:translate(0,0) scaleX(-1)}
  76%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(1)}
}
@keyframes townWorkerHarvest{
  0%{transform:translate(0,0) scaleX(1)}
  15%{transform:translate(20px,0) scaleX(1)}
  /* 弯腰割麦：身体下沉 + 左右横扫 */
  18%{transform:translate(16px,5px) scaleX(1)}
  22%{transform:translate(24px,4px) scaleX(1)}
  26%{transform:translate(17px,6px) scaleX(1)}
  30%{transform:translate(23px,5px) scaleX(1)}
  34%{transform:translate(18px,6px) scaleX(1)}
  38%{transform:translate(22px,4px) scaleX(1)}
  44%{transform:translate(20px,0) scaleX(1)}
  52%{transform:translate(20px,0) scaleX(1)}
  56%{transform:translate(20px,0) scaleX(-1)}
  72%{transform:translate(0,0) scaleX(-1)}
  76%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(1)}
}
@keyframes townWorkerStep{
  0%{transform:translate(0,0) scaleX(1)}
  15%{transform:translate(-10px,1px) scaleX(1)}
  /* 弯腰堆放 */
  18%{transform:translate(-9px,4px) scaleX(1)}
  22%{transform:translate(-11px,3px) scaleX(1)}
  26%{transform:translate(-9px,5px) scaleX(1)}
  30%{transform:translate(-10px,3px) scaleX(1)}
  34%{transform:translate(-11px,4px) scaleX(1)}
  40%{transform:translate(-10px,1px) scaleX(1)}
  52%{transform:translate(-10px,1px) scaleX(1)}
  56%{transform:translate(-10px,1px) scaleX(-1)}
  72%{transform:translate(0,0) scaleX(-1)}
  76%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(1)}
}
@keyframes townToolChop{
  0%{transform:rotate(-35deg)}
  50%{transform:rotate(30deg)}
  100%{transform:rotate(-35deg)}
}
@keyframes townToolMine{
  0%{transform:rotate(10deg)}
  50%{transform:rotate(-25deg)}
  100%{transform:rotate(10deg)}
}
@keyframes townToolHarvest{
  0%{transform:rotate(5deg)}
  50%{transform:rotate(-20deg)}
  100%{transform:rotate(5deg)}
}

.guard-stand{animation:townGuardStand 2.4s ease-in-out infinite}
.guard-pulse{animation:townGuardPulse 2.2s ease-in-out infinite}
@keyframes townGuardPatrol{
  0%{transform:translate(0,0) scaleX(-1)}
  45%{transform:translate(26px,0) scaleX(-1)}
  50%{transform:translate(26px,0) scaleX(1)}
  95%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(-1)}
}
@keyframes townGuardWatch{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
@keyframes townGuardRide{
  0%{transform:translate(0,0) scaleX(-1)}
  45%{transform:translate(80px,-6px) scaleX(-1)}
  50%{transform:translate(80px,-6px) scaleX(1)}
  95%{transform:translate(0,0) scaleX(1)}
  100%{transform:translate(0,0) scaleX(-1)}
}
@keyframes townGuardStand{
  0%,100%{transform:scaleY(1)}
  50%{transform:scaleY(.92)}
}
@keyframes townGuardPulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
.town-invasion-layer,.town-vfx-layer{
  position:absolute;inset:0;pointer-events:none;
}
.town-invasion-layer{z-index:12}
.town-vfx-layer{z-index:20;overflow:hidden}
.town-phase-banner{
  position:absolute;left:50%;top:8px;z-index:32;transform:translateX(-50%);
  padding:5px 12px;border:2px solid #d6a83f;background:rgba(12,12,20,.92);
  color:#f0d060;font-size:10px;line-height:1;text-shadow:1px 1px 0 #000;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.12),0 3px 8px rgba(0,0,0,.5);
  font-weight:bold;
  animation:banner-glow 2s ease-in-out infinite;
}
@keyframes banner-glow{
  0%,100%{box-shadow:inset 1px 1px 0 rgba(255,255,255,.12),0 3px 8px rgba(0,0,0,.5)}
  50%{box-shadow:inset 1px 1px 0 rgba(255,255,255,.15),0 3px 12px rgba(0,0,0,.6),0 0 16px rgba(214,168,63,.4)}
}
.town-map.is-warning{
  animation:townWarningPulse .9s ease-in-out infinite;
}
.town-map.is-warning .town-frontier-zone,.town-map.is-battle .town-frontier-zone,.town-map.is-result .town-frontier-zone{
  display:block;
}
/* 出击动画 — 每个兵种独立偏移，向右侧敌人方向移动但不出界 */
.town-map.is-sortie .guard-archer{animation:townGuardSortieArcher 1.25s ease-out forwards}
.town-map.is-sortie .guard-cavalry{animation:townGuardSortieCavalry 1.25s ease-out forwards}
.town-map.is-sortie .guard-infantry{animation:townGuardSortieInfantry 1.25s ease-out forwards}
.town-map.is-sortie .guard-mage{animation:townGuardSortieMage 1.25s ease-out forwards}
.town-map.is-sortie .guard-spearman{animation:townGuardSortieSpearman 1.25s ease-out forwards}
/* 交战状态 — 每个兵种停在对应位置，不再统一偏移 */
.town-map.is-battle .town-guard{animation:none!important}
.town-map.is-battle .guard-archer{transform:translate(70px,3px) scaleX(-1)}
.town-map.is-battle .guard-cavalry{transform:translate(45px,-4px) scaleX(-1)}
.town-map.is-battle .guard-infantry{transform:translate(25px,4px) scaleX(-1)}
.town-map.is-battle .guard-mage{transform:translate(8px,6px) scaleX(-1)}
.town-map.is-battle .guard-spearman{transform:translate(-15px,3px) scaleX(-1)}
.town-invader{
  position:absolute;right:8%;top:62%;width:42px;height:42px;opacity:1;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.5)) hue-rotate(-10deg);
  transition:filter .3s ease;
}
.town-invader:hover{
  filter:drop-shadow(0 6px 4px rgba(0,0,0,.6)) hue-rotate(-10deg) brightness(1.15);
}
.town-invader .pix-icon{width:100%;height:100%;display:block}
.town-invader.invader-1{top:56%;animation-delay:.05s}
.town-invader.invader-2{top:65%;animation-delay:.22s}
.town-invader.invader-3{top:60%;animation-delay:.38s}
.town-map.is-spawn .town-invader{
  right:-58px;opacity:0;animation:townInvaderEnter 1.1s ease-out forwards;
}
.town-map.is-battle .town-invader{
  animation:townInvaderBattle .72s ease-in-out infinite;
}
.town-map.is-result.result-win .town-invader{
  animation:townInvaderDefeat .8s ease forwards;
}
.town-map.is-result.result-lose .town-guard{
  filter:grayscale(.6) brightness(.8);
}
.town-skirmish-flash{
  position:absolute;left:41%;top:55%;width:116px;height:60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,224,120,.5),rgba(224,96,96,.2) 48%,transparent 70%);
  animation:townSkirmishFlash .42s ease-in-out infinite;
  filter:blur(3px);
}
@keyframes townSkirmishFlash{
  0%,100%{opacity:.3;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}
.town-demo-vfx{
  opacity:0;transform:translate(-50%,-50%) rotate(-8deg);
  animation:townDemoVfx .78s ease-in-out infinite;
}
.town-demo-vfx:nth-child(2){animation-delay:.18s}
.town-demo-vfx:nth-child(3){animation-delay:.34s}
.town-cooldown-bar{
  display:none;position:absolute;left:28px;right:28px;bottom:8px;z-index:31;height:6px;
  border:2px solid #59617b;background:rgba(8,10,18,.88);
  box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(0,0,0,.5);
}
.town-map.is-cooldown .town-cooldown-bar{display:block}
.town-cooldown-bar i{
  display:block;height:100%;
  background:repeating-linear-gradient(90deg,#4f9b67 0 6px,#78d18e 6px 9px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  transition:width .5s linear;
}
.town-map.is-warning{
  animation:townWarningPulse 1s ease-in-out infinite;
}
@keyframes townWarningPulse{
  0%,100%{
    box-shadow:inset 0 0 0 4px #090d13,inset 3px 3px 0 rgba(255,255,255,.08),inset -3px -3px 0 rgba(0,0,0,.6),0 4px 0 #05060b;
  }
  50%{
    box-shadow:inset 0 0 0 4px #5a1d1d,inset 0 0 32px rgba(224,72,72,.6),0 4px 0 #05060b,0 0 20px rgba(224,72,72,.4);
  }
}
@keyframes townInvaderEnter{
  from{right:-58px;opacity:0}
  to{right:8%;opacity:1}
}
@keyframes townInvaderBattle{
  0%,100%{right:8%;transform:translateY(0) scaleX(-1)}
  50%{right:14%;transform:translateY(-3px) scaleX(-1)}
}
@keyframes townInvaderDefeat{
  0%{right:8%;opacity:1;filter:grayscale(0)}
  100%{right:4%;opacity:0;filter:grayscale(1);transform:translateY(8px) scale(.75)}
}
@keyframes townGuardSortieArcher{
  0%{transform:translate(0,0) scaleX(-1)}
  100%{transform:translate(70px,3px) scaleX(-1)}
}
@keyframes townGuardSortieCavalry{
  0%{transform:translate(0,0) scaleX(-1)}
  100%{transform:translate(45px,-4px) scaleX(-1)}
}
@keyframes townGuardSortieInfantry{
  0%{transform:translate(0,0) scaleX(-1)}
  100%{transform:translate(25px,4px) scaleX(-1)}
}
@keyframes townGuardSortieMage{
  0%{transform:translate(0,0) scaleX(-1)}
  100%{transform:translate(8px,6px) scaleX(-1)}
}
@keyframes townGuardSortieSpearman{
  0%{transform:translate(0,0) scaleX(-1)}
  100%{transform:translate(-15px,3px) scaleX(-1)}
}
@keyframes townSkirmishFlash{
  0%,100%{opacity:.3;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}
@keyframes townDemoVfx{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(.72)}
  35%{opacity:1;transform:translate(-10%,-50%) rotate(-10deg) scale(1.05)}
  100%{opacity:0;transform:translate(32%,-50%) rotate(-10deg) scale(.92)}
}
.town-troop-summary{
  margin-top:8px;padding:8px 10px;border:2px solid #2b3144;
  background:linear-gradient(180deg,#0d101b,#0a0c14);
  color:#c5cad8;
  font-size:10px;line-height:1.5;word-break:break-all;
  text-shadow:1px 1px 0 #000;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.04);
}
/* IE-007：资源增减直观反馈（CSS-only） */
.top-res{position:relative}
.res-delta{
  position:absolute;right:2px;top:-2px;font-size:10px;line-height:1;
  pointer-events:none;opacity:0;font-weight:bold;
  text-shadow:1px 1px 2px #000,0 0 4px currentColor;
}
.res-delta.up{color:#5ad06a}
.res-delta.down{color:#ff7070}
.res-delta.up,.res-delta.down{animation:resFloatUp 1s ease-out forwards}
@keyframes resFloatUp{
  0%{opacity:0;transform:translateY(4px) scale(.8)}
  20%{opacity:1;transform:translateY(0) scale(1.1)}
  100%{opacity:0;transform:translateY(-12px) scale(1)}
}
#topbar .val.up{
  color:#8fe89f!important;
  text-shadow:1px 1px 0 #000,0 0 8px #5ad06a;
  animation:val-flash-up .5s ease;
}
#topbar .val.down{
  color:#ff8a8a!important;
  text-shadow:1px 1px 0 #000,0 0 8px #e05050;
  animation:val-flash-down .5s ease;
}
@keyframes val-flash-up{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.15)}
}
@keyframes val-flash-down{
  0%,100%{transform:scale(1)}
  50%{transform:scale(.9)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .town-worker,.town-worker:after,.town-guard,.town-map.is-warning,.town-invader,
  .town-demo-vfx,.town-skirmish-flash{
    animation:none!important;
  }
  .res-delta.up,.res-delta.down{animation:none!important}
  .unit-box.attacking,.unit-box.hit,.unit-box.dead{animation:none!important}
  .prog-fill{animation:none!important}
  .tier-t3{animation:none!important}
}

/* ===== 像素风皮肤（CSS变量 + 暗色主题）===== */
:root{
  /* 基础色彩 */
  --px-bg:#080912;
  --px-panel:#151724;
  --px-panel-2:#1c2030;
  --px-line:#3a4158;
  --px-line-dark:#05060b;
  --px-gold:#d6a83f;
  --px-gold-soft:#f0d060;
  --px-red:#b34a4a;
  --px-blue:#4f78b7;
  --px-green:#4f9b67;
  --px-muted:#8890a6;

  /* 资源色彩系统 */
  --res-wood:#8b6f47;
  --res-stone:#778899;
  --res-food:#9acd32;
  --res-tech:#6495ed;
  --res-coal:#2f2f2f;
  --res-copper:#cd853f;
  --res-iron:#708090;
  --res-silver:#c0c0c0;
  --res-gold:#ffd700;
  --res-steel:#4682b4;

  /* 稀有度色阶 */
  --tier-common:#8e8e9a;
  --tier-uncommon:#5dbd6f;
  --tier-rare:#4a9fd8;
  --tier-epic:#a855d8;
  --tier-legendary:#ff9933;

  /* 状态色 */
  --status-success:#4caf50;
  --status-warning:#ff9800;
  --status-error:#f44336;
  --status-info:#2196f3;

  /* 文本色 */
  --text-primary:#e7e7ef;
  --text-secondary:#b8bcc8;
  --text-muted:#7a7f8e;
  --text-disabled:#4a4d5a;
}
*{image-rendering:pixelated}
body{
  background-color:var(--px-bg);
  background-image:
    linear-gradient(45deg,rgba(214,168,63,.05) 25%,transparent 25%),
    linear-gradient(-45deg,rgba(79,120,183,.04) 25%,transparent 25%),
    linear-gradient(#111421 1px,transparent 1px);

}
#phone{

  border:4px solid var(--px-line);
  border-radius:0;
  box-shadow:0 0 0 4px var(--px-line-dark),0 0 0 5px #2a2f42,0 16px 32px rgba(0,0,0,.5);
}
#topbar,#navbar,#battle-top{

  border-color:#30364a;

#main{background:linear-gradient(180deg,#101220,#0b0d17)}

.pix-icon.mini{width:14px;height:14px;vertical-align:-2px}

.pix-icon.top-pix{width:22px;height:22px;display:block;margin:0 auto 1px}
.pix-icon.card-pix{margin-right:5px}
.card,.modal-box,.unit-box,.form-slot,.modal-unit,.btn,.btn-speed,.toast{

  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),inset -2px -2px 0 rgba(0,0,0,.5),0 3px 0 #05060b;

.card,.modal-box,.unit-box,.form-slot,.modal-unit,.btn,.btn-speed{

}

.btn-ghost{background:#111422;border-color:#3b4158;color:#c5cad8}

@keyframes strike{0%,100%{transform:translateY(0);box-shadow:0 0 8px rgba(255,255,200,.6)}30%{transform:translateY(-6px);box-shadow:0 0 18px rgba(255,255,150,.9)}60%{transform:translateY(3px);box-shadow:0 0 14px rgba(255,255,200,.7)}}
@keyframes shaken{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px);border-color:#ff4444}40%{transform:translateX(5px)}60%{transform:translateX(-3px);border-color:#ff0000}80%{transform:translateX(3px)}}

#battle-field{position:relative}
#battle-vfx-layer{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:visible}
.vfx{
  position:absolute;pointer-events:none;z-index:999;
  transform-origin:center center;
  will-change:transform,opacity;
}
.vfx-slash{
  width:28px;height:28px;border-radius:50%;border:5px solid transparent;
  border-top-color:#ffe566;border-right-color:#ffb800;
  box-shadow:0 0 16px rgba(255,215,0,1),0 0 35px rgba(255,180,0,.7),0 0 55px rgba(255,120,0,.4);
  animation:vfx-slash-spin .4s linear;
}
@keyframes vfx-slash-spin{
  from{transform:rotate(0deg) scale(.8);opacity:0}
  50%{opacity:1;transform:rotate(180deg) scale(1.2)}
  to{transform:rotate(360deg) scale(.6);opacity:0}
}
.vfx-slash::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  border:3px solid transparent;border-top-color:#fff9c0;border-right-color:#ffd700;
  box-shadow:0 0 10px rgba(255,255,200,1);
}
.vfx-swordqi,.vfx-arrow,.vfx-thrust,.vfx-cavslash,.vfx-magebolt{
  background-position:center;background-repeat:no-repeat;background-size:contain;
  image-rendering:pixelated;
  will-change:transform,opacity,filter;
}

.unit-box{
  width:76px;height:92px;min-height:0;padding:0;display:block;overflow:hidden;
  background:linear-gradient(180deg,#161a26,#080912);
  border:3px solid #444957;color:#d9deeb;
  position:relative;isolation:isolate;
  transition:all .2s ease;
  will-change:transform;
}
.unit-box:hover{
  transform:translateY(-2px);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.1),inset -3px -3px 0 rgba(0,0,0,.6),0 6px 12px rgba(0,0,0,.4);
}
.unit-box::before,.unit-box::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
}
.unit-box::before{
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.1),inset -3px -3px 0 rgba(0,0,0,.65);
}
.unit-box .unit-art{
  position:absolute;inset:2px 2px 7px;z-index:1;display:block;overflow:hidden;
  background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.1),transparent 48%);
}
.unit-box .unit-art .pix-icon.lg{
  width:100%;height:100%;vertical-align:0;
  background-size:cover!important;
  background-position:center bottom!important;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  filter:drop-shadow(0 3px 1px rgba(0,0,0,.6));
  transition:filter .2s ease;
}
.unit-box:hover .unit-art .pix-icon.lg{
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.7)) brightness(1.05);
}
.unit-box .unit-hpbar{
  position:absolute;left:3px;right:3px;bottom:2px;height:4px;z-index:5;
  background:#05060b;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 -1px 0 rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
}
.unit-box .unit-hpfill{
  display:block;height:100%;
  background:linear-gradient(90deg,#4f9b67,#7bdc73);
  transition:width .2s ease-out;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.unit-box .unit-shield{
  position:absolute;top:2px;right:2px;z-index:5;padding:1px 3px;
  border:1px solid #749fc4;background:#122339;color:#a8d9ff;font-size:9px;line-height:1.1;
}
.unit-box .unit-hpcount{
  position:absolute;left:3px;right:3px;bottom:8px;z-index:5;
  color:#fff;font-size:9px;font-weight:bold;text-align:center;line-height:1.1;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,0 0 3px #000;
}
.unit-box.hp-mid .unit-hpfill{
  background:linear-gradient(90deg,#b47b2a,#f0d060);
}
.unit-box.hp-low .unit-hpfill{
  background:linear-gradient(90deg,#9d2f37,#e06060);
  animation:hp-low-pulse 1s ease-in-out infinite;
}
@keyframes hp-low-pulse{
  0%,100%{opacity:1}
  50%{opacity:.7}
}
.unit-box.tier-t0{
  border-color:#4a4d5a;
  box-shadow:inset 0 0 0 1px #202431,0 3px 0 #05060b;
}
.unit-box.tier-t1{
  border-color:#9a6631;
  box-shadow:inset 0 0 0 1px #402817,0 3px 0 #05060b,0 0 14px rgba(160,96,42,.18);
}
.unit-box.tier-t1::before{
  background:
    linear-gradient(135deg,#d59a4a 0 8px,transparent 9px) left top/18px 18px no-repeat,
    linear-gradient(225deg,#d59a4a 0 8px,transparent 9px) right top/18px 18px no-repeat,
    linear-gradient(45deg,#8b5525 0 7px,transparent 8px) left bottom/16px 16px no-repeat,
    linear-gradient(315deg,#8b5525 0 7px,transparent 8px) right bottom/16px 16px no-repeat;

}
.unit-box.tier-t2{
  border-color:#a6b1c8;
  box-shadow:inset 0 0 0 1px #343b4e,0 3px 0 #05060b,0 0 16px rgba(150,185,230,.25);
}
.unit-box.tier-t2::before{
  background:
    linear-gradient(135deg,#edf4ff 0 6px,#6f7e99 6px 11px,transparent 12px) left top/20px 20px no-repeat,
    linear-gradient(225deg,#edf4ff 0 6px,#6f7e99 6px 11px,transparent 12px) right top/20px 20px no-repeat,
    linear-gradient(45deg,#6f7e99 0 8px,transparent 9px) left bottom/18px 18px no-repeat,
    linear-gradient(315deg,#6f7e99 0 8px,transparent 9px) right bottom/18px 18px no-repeat;
  box-shadow:inset 3px 3px 0 rgba(235,246,255,.2),inset -3px -3px 0 rgba(0,0,0,.55);
}
.unit-box.tier-t3{
  border-color:#f0d060;
  box-shadow:inset 0 0 0 1px #6d4314,0 3px 0 #05060b,0 0 20px rgba(240,208,96,.35);
  animation:tier-legendary-glow 2s ease-in-out infinite;
}
.unit-box.tier-t3::before{
  background:
    linear-gradient(135deg,#fff1a2 0 7px,#b47b2a 7px 13px,transparent 14px) left top/22px 22px no-repeat,
    linear-gradient(225deg,#fff1a2 0 7px,#b47b2a 7px 13px,transparent 14px) right top/22px 22px no-repeat,
    linear-gradient(45deg,#b47b2a 0 10px,transparent 11px) left bottom/20px 20px no-repeat,
    linear-gradient(315deg,#b47b2a 0 10px,transparent 11px) right bottom/20px 20px no-repeat;
  box-shadow:inset 3px 3px 0 rgba(255,241,162,.25),inset -3px -3px 0 rgba(87,51,10,.65);
}
.unit-box.tier-t3::after{
  background:
    radial-gradient(circle at 9px 9px,#e06060 0 2px,#6d1d24 3px,transparent 4px),
    radial-gradient(circle at calc(100% - 9px) 9px,#74a8ff 0 2px,#1e4d92 3px,transparent 4px);
}
@keyframes tier-legendary-glow{
  0%,100%{box-shadow:inset 0 0 0 1px #6d4314,0 3px 0 #05060b,0 0 20px rgba(240,208,96,.35)}
  50%{box-shadow:inset 0 0 0 1px #8d6324,0 3px 0 #05060b,0 0 28px rgba(240,208,96,.5)}

.unit-box.targeted{

@keyframes target-pulse{

<!-- ==================== HTML 骨架 ==================== -->
<!-- 手机框体 → 顶栏(资源) → 城镇场景 → 主内容区 → 底部导航 → 弹窗 → 战斗画面 -->
<div id="phone">
